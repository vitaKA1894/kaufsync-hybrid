name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'GitHub Release mit der APK erstellen?'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Web App with Production Backend
        env:
          VITE_API_URL: https://einkaufsliste.kotrini.de
          VITE_WS_URL: wss://einkaufsliste.kotrini.de
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/KaufSync.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaufSync-APK
          path: build-output/KaufSync.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/KaufSync.apk
          tag_name: ${{ github.ref_name || format('v0.0.{0}', github.run_number) }}
          name: KaufSync App ${{ github.ref_name || format('v0.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
