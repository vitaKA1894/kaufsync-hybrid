<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Halved grapefruit showing bold ruby segments and thick white rind -->
  <circle cx="12" cy="12" r="8.5" fill="currentColor" fill-opacity="0.25"/>
  <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="12" cy="12" r="6" fill="currentColor" fill-opacity="0.4"/>
  <!-- Big segment dividers -->
  <line x1="12" y1="6" x2="12" y2="18" stroke="currentColor" stroke-width="1.8"/>
  <line x1="6" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="1.8"/>
  <line x1="7.8" y1="7.8" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="1.8"/>
  <line x1="7.8" y1="16.2" x2="16.2" y2="7.8" stroke="currentColor" stroke-width="1.8"/>
</svg>
