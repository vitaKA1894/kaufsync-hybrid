<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Adhesive bandage / plaster with central wound pad and ventilation holes -->
  <rect x="3" y="8.5" width="18" height="7" rx="3.5" fill="currentColor" fill-opacity="0.3" transform="rotate(-30 12 12)"/>
  <rect x="3" y="8.5" width="18" height="7" rx="3.5" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-30 12 12)"/>
  <!-- Central gauze pad -->
  <rect x="9.5" y="8.5" width="5" height="7" fill="currentColor" fill-opacity="0.6" stroke="currentColor" stroke-width="1.5" transform="rotate(-30 12 12)"/>
  <!-- Perforation dots -->
  <circle cx="6.5" cy="15" r="0.6" fill="currentColor"/>
  <circle cx="17.5" cy="9" r="0.6" fill="currentColor"/>
</svg>
