<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-pflaster" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Adhesive bandage / plaster with central wound pad and ventilation holes -->
  <rect x="3" y="8.5" width="18" height="7" rx="3.5" fill="#F59E0B" fill-opacity="0.14" transform="rotate(-30 12 12)"/>
  <rect x="3" y="8.5" width="18" height="7" rx="3.5" fill="none" stroke="#F59E0B" filter="url(#glow-pflaster)" stroke-width="2" transform="rotate(-30 12 12)"/>
  <!-- Central gauze pad -->
  <rect x="9.5" y="8.5" width="5" height="7" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="1.5" transform="rotate(-30 12 12)"/>
  <!-- Perforation dots -->
  <circle cx="6.5" cy="15" r="0.6" fill="#F59E0B" fill-opacity="0.35"/>
  <circle cx="17.5" cy="9" r="0.6" fill="#F59E0B" fill-opacity="0.35"/>
</svg>