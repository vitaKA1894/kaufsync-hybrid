  <rect x="6" y="5" width="12" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="6" y="9.5" width="12" height="6" fill="currentColor" fill-opacity="0.4"/>
  <text x="12" y="13.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.1" font-weight="900" letter-spacing="0.3" fill="currentColor" text-anchor="middle">TOMATEN</text>
