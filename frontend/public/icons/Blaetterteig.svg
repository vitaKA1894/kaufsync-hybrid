<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Rolled flaky puff pastry with visible spiral layers -->
  <rect x="5" y="7" width="14" height="11" rx="2" fill="currentColor" fill-opacity="0.22"/>
  <rect x="5" y="7" width="14" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Multi-layered pastry sheets -->
  <line x1="5" y1="10.5" x2="19" y2="10.5" stroke="currentColor" stroke-width="1.5"/>
  <line x1="5" y1="14" x2="19" y2="14" stroke="currentColor" stroke-width="1.5"/>
  <!-- Flour dusting / baker hat -->
  <circle cx="9" cy="8.5" r="0.6" fill="currentColor"/>
  <circle cx="15" cy="8.5" r="0.6" fill="currentColor"/>
  <text x="12" y="17.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2" font-weight="900" fill="currentColor" text-anchor="middle">TEIG</text>
</svg>
