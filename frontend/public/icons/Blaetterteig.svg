<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-blaetterteig" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Rolled flaky puff pastry with visible spiral layers -->
  <rect x="5" y="7" width="14" height="11" rx="2" fill="#FDE68A" fill-opacity="0.14"/>
  <rect x="5" y="7" width="14" height="11" rx="2" fill="none" stroke="#FDE68A" filter="url(#glow-blaetterteig)" stroke-width="2"/>
  <!-- Multi-layered pastry sheets -->
  <line x1="5" y1="10.5" x2="19" y2="10.5" stroke="#FDE68A" stroke-width="1.5"/>
  <line x1="5" y1="14" x2="19" y2="14" stroke="#FDE68A" stroke-width="1.5"/>
  <!-- Flour dusting / baker hat -->
  <circle cx="9" cy="8.5" r="0.6" fill="#FDE68A" fill-opacity="0.35"/>
  <circle cx="15" cy="8.5" r="0.6" fill="#FDE68A" fill-opacity="0.35"/>
  <text x="12" y="17.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2" font-weight="900" fill="#FDE68A" fill-opacity="0.35" text-anchor="middle">TEIG</text>
</svg>