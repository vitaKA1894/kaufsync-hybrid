<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Cleaning sponge with grooved scouring top layer & pores -->
  <rect x="4" y="8" width="16" height="11" rx="2" fill="currentColor" fill-opacity="0.25"/>
  <rect x="4" y="8" width="16" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Green scouring fleece layer -->
  <rect x="4" y="8" width="16" height="3.5" rx="1" fill="currentColor" fill-opacity="0.6"/>
  <!-- Sponge pores -->
  <circle cx="8" cy="14" r="1" fill="currentColor"/>
  <circle cx="12" cy="16" r="1.3" fill="currentColor"/>
  <circle cx="16" cy="14" r="0.8" fill="currentColor"/>
</svg>
