<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-whisky" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Square heavy-bottom whisky bottle -->
  <rect x="6.5" y="7" width="11" height="14" rx="2" fill="#D97706" fill-opacity="0.14"/>
  <rect x="6.5" y="7" width="11" height="14" rx="2" fill="none" stroke="#D97706" filter="url(#glow-whisky)" stroke-width="2"/>
  <rect x="9.5" y="3" width="5" height="4" rx="0.8" fill="#D97706" fill-opacity="0.14" stroke="#D97706" stroke-width="1.8"/>
  <rect x="7.5" y="10.5" width="9" height="7" rx="1" fill="#D97706" fill-opacity="0.14"/>
  <text x="12" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.0" font-weight="900" letter-spacing="0.3" fill="#D97706" fill-opacity="0.35" text-anchor="middle">WHISKY</text>
  <text x="12" y="16.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="1.5" font-weight="800" letter-spacing="0.2" fill="#D97706" fill-opacity="0.35" text-anchor="middle">AGED</text>
</svg>