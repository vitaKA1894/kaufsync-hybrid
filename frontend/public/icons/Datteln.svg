<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-datteln" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#92400E" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Elongated dried Medjool dates on a palm stalk -->
  <ellipse cx="9" cy="15" rx="3.5" ry="6" fill="#92400E" fill-opacity="0.14" transform="rotate(-15 9 15)"/>
  <ellipse cx="9" cy="15" rx="3.5" ry="6" fill="none" stroke="#92400E" filter="url(#glow-datteln)" stroke-width="2" transform="rotate(-15 9 15)"/>
  <ellipse cx="15.5" cy="12" rx="3.5" ry="5.5" fill="#92400E" fill-opacity="0.14" transform="rotate(20 15.5 12)"/>
  <ellipse cx="15.5" cy="12" rx="3.5" ry="5.5" fill="none" stroke="#92400E" stroke-width="2" transform="rotate(20 15.5 12)"/>
  <!-- Wrinkle lines of dried dates -->
  <path d="M8 12c.5 2 .5 4 0 6 M15 9c.5 2 .5 4 0 6" stroke="#92400E" stroke-width="1.3" stroke-linecap="round"/>
</svg>