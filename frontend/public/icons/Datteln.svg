  <ellipse cx="9" cy="15" rx="3.5" ry="6" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-15 9 15)"/>
  <ellipse cx="15.5" cy="12" rx="3.5" ry="5.5" fill="currentColor" fill-opacity="0.5" transform="rotate(20 15.5 12)"/>
  <ellipse cx="15.5" cy="12" rx="3.5" ry="5.5" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(20 15.5 12)"/>
  <!-- Wrinkle lines of dried dates -->
  <path d="M8 12c.5 2 .5 4 0 6 M15 9c.5 2 .5 4 0 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
