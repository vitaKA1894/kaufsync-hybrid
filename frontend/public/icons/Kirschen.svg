<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Pair of cherries connected at the top by a double stem and leaf -->
  <circle cx="7.5" cy="16.5" r="4.5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="7.5" cy="16.5" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="16.5" cy="15.5" r="4.5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="16.5" cy="15.5" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Stems joining at top -->
  <path d="M7.5 12C9 7 13 4 15 3m1.5 8C16 8 14 5 15 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <!-- Cherry leaf -->
  <path d="M15 3c2-1 4 0 4 1s-2 2-4-1z" fill="currentColor"/>
</svg>
