<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-kirschen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#E11D48" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Pair of cherries connected at the top by a double stem and leaf -->
  <circle cx="7.5" cy="16.5" r="4.5" fill="#E11D48" fill-opacity="0.14"/>
  <circle cx="7.5" cy="16.5" r="4.5" fill="none" stroke="#E11D48" filter="url(#glow-kirschen)" stroke-width="2"/>
  <circle cx="16.5" cy="15.5" r="4.5" fill="#E11D48" fill-opacity="0.14"/>
  <circle cx="16.5" cy="15.5" r="4.5" fill="none" stroke="#E11D48" stroke-width="2"/>
  <!-- Stems joining at top -->
  <path d="M7.5 12C9 7 13 4 15 3m1.5 8C16 8 14 5 15 3" stroke="#15803D" stroke-width="2" stroke-linecap="round"/>
  <!-- Cherry leaf -->
  <path d="M15 3c2-1 4 0 4 1s-2 2-4-1z" fill="#E11D48" fill-opacity="0.35"/>
</svg>