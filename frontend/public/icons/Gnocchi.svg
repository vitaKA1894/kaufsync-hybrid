<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-gnocchi" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#FBBF24" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Ridged potato dumplings (Gnocchi) with fork ridges -->
  <ellipse cx="9" cy="14" rx="5.5" ry="4" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" filter="url(#glow-gnocchi)" stroke-width="2" transform="rotate(-15 9 14)"/>
  <ellipse cx="15.5" cy="10" rx="5.5" ry="4" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-width="2" transform="rotate(20 15.5 10)"/>
  <!-- Fork ridges on gnocchi -->
  <line x1="7" y1="12.5" x2="8" y2="16" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="12" x2="10" y2="15.5" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="11.5" x2="12" y2="15" stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round"/>
</svg>