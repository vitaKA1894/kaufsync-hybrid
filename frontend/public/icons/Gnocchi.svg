<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Ridged potato dumplings (Gnocchi) with fork ridges -->
  <ellipse cx="9" cy="14" rx="5.5" ry="4" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="2" transform="rotate(-15 9 14)"/>
  <ellipse cx="15.5" cy="10" rx="5.5" ry="4" fill="currentColor" fill-opacity="0.4" stroke="currentColor" stroke-width="2" transform="rotate(20 15.5 10)"/>
  <!-- Fork ridges on gnocchi -->
  <line x1="7" y1="12.5" x2="8" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="9" y1="12" x2="10" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="11.5" x2="12" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
