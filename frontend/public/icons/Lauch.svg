  <rect x="9.5" y="10" width="5" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Spreading flat dark-green blade leaves -->
  <path d="M10 10L4 3.5 M12 10V2 M14 10L20 3.5 M10 7L6 2 M14 7L18 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
