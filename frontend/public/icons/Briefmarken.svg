<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Postage Stamp with perforated stamp border and posthorn mark -->
  <path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="currentColor" fill-opacity="0.22"/>
  <rect x="4" y="4" width="16" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Perforation notches around edges -->
  <circle cx="8" cy="4" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="12" cy="4" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="16" cy="4" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="8" cy="20" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="12" cy="20" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="16" cy="20" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="4" cy="8" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="4" cy="12" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="4" cy="16" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="20" cy="8" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="20" cy="12" r="0.8" fill="var(--bg, #0f172a)"/>
  <circle cx="20" cy="16" r="0.8" fill="var(--bg, #0f172a)"/>
  <!-- Postmark lines and stamp inner emblem -->
  <rect x="7" y="7" width="10" height="10" rx="0.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1"/>
  <!-- Envelope / post emblem inside -->
  <path d="M8.5 9.5h7v5h-7z" fill="currentColor" fill-opacity="0.3"/>
  <path d="M8.5 9.5l3.5 2.5 3.5-2.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
</svg>