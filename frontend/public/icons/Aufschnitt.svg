  <ellipse cx="13" cy="12" rx="5.5" ry="4.5" fill="#F43F5E" fill-opacity="0.14" stroke="#F43F5E" stroke-width="1.8"/>
  <ellipse cx="15" cy="15" rx="5.5" ry="4.5" fill="#F43F5E" fill-opacity="0.14" stroke="#F43F5E" stroke-width="2"/>
  <!-- Seasoning specks -->
  <circle cx="14" cy="15" r="0.7" fill="#F43F5E" fill-opacity="0.35"/>
  <circle cx="16.5" cy="14" r="0.7" fill="#F43F5E" fill-opacity="0.35"/>
</svg>