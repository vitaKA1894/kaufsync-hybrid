<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-cherrytomaten" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#FF3B30" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Cluster of 3 small cherry tomatoes on a vine branch -->
  <circle cx="7" cy="15" r="4" fill="#FF3B30" fill-opacity="0.14" stroke="#FF3B30" filter="url(#glow-cherrytomaten)" stroke-width="1.8"/>
  <circle cx="15.5" cy="16" r="4" fill="#FF3B30" fill-opacity="0.14" stroke="#FF3B30" stroke-width="1.8"/>
  <circle cx="12" cy="9.5" r="3.5" fill="#FF3B30" fill-opacity="0.14" stroke="#FF3B30" stroke-width="1.8"/>
  <!-- Vine connecting them -->
  <path d="M4 12c4-2 8-1 12-4" stroke="#FF3B30" stroke-width="1.8" stroke-linecap="round"/>
