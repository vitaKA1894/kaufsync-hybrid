<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-streichhoelzer" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#EF4444" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Matchbox with match striking fire -->
  <rect x="5" y="10" width="14" height="10" rx="1.5" fill="#F59E0B" fill-opacity="0.14"/>
  <rect x="5" y="10" width="14" height="10" rx="1.5" fill="none" stroke="#F59E0B" filter="url(#glow-streichhoelzer)" stroke-width="2"/>
  <!-- Match striking -->
  <line x1="11" y1="10" x2="18" y2="3" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18.5" cy="2.5" r="1.5" fill="#F59E0B" fill-opacity="0.35"/>
</svg>