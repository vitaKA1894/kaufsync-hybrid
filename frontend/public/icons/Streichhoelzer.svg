<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Matchbox with match striking fire -->
  <rect x="5" y="10" width="14" height="10" rx="1.5" fill="currentColor" fill-opacity="0.25"/>
  <rect x="5" y="10" width="14" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Match striking -->
  <line x1="11" y1="10" x2="18" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18.5" cy="2.5" r="1.5" fill="currentColor"/>
</svg>
