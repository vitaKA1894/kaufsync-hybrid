  <rect x="3" y="7" width="18" height="2.5" rx="1" fill="#F8FAFC" fill-opacity="0.14" stroke="#F8FAFC" stroke-width="1.5"/>
  <rect x="5.5" y="11.5" width="13" height="5.5" rx="1" fill="#F8FAFC" fill-opacity="0.14"/>
  <text x="12" y="15.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.4" font-weight="900" letter-spacing="0.3" fill="#F8FAFC" fill-opacity="0.35" text-anchor="middle">MASC.</text>
</svg>