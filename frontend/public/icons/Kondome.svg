<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-kondome" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#EC4899" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Square sealed foil condom wrapper with circular embossed center -->
  <rect x="4" y="4" width="16" height="16" rx="2" fill="#EC4899" fill-opacity="0.14"/>
  <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="#EC4899" filter="url(#glow-kondome)" stroke-width="2"/>
  <!-- Circular embossed seal ring -->
  <circle cx="12" cy="12" r="5" fill="#EC4899" fill-opacity="0.14" stroke="#EC4899" stroke-width="1.8"/>
  <circle cx="12" cy="12" r="2" fill="#0b0f19"/>
</svg>