<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Square sealed foil condom wrapper with circular embossed center -->
  <rect x="4" y="4" width="16" height="16" rx="2" fill="currentColor" fill-opacity="0.25"/>
  <rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Circular embossed seal ring -->
  <circle cx="12" cy="12" r="5" fill="currentColor" fill-opacity="0.45" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="12" cy="12" r="2" fill="#0b0f19"/>
</svg>
