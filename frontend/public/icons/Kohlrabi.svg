<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-kohlrabi" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#4ADE80" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Kohlrabi: spherical stem tuber with long leaf stalks radiating out -->
  <circle cx="12" cy="15" r="6" fill="#4ADE80" fill-opacity="0.14"/>
