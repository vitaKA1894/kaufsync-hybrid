  <path d="M12 9V2.5 M12 3c-1-1-2 0-2 1s1 1 2-1z" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M8 11L4 5 M4 5.5c-1-1 0-2 1-1.5s.5 1.5-1 1.5z" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round"/>
