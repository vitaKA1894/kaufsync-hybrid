<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Cornstarch box (Maizena) labeled STAERKE with corn ear -->
  <rect x="6" y="5" width="12" height="15" rx="1.5" fill="currentColor" fill-opacity="0.22"/>
  <rect x="6" y="5" width="12" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="7" y="10" width="10" height="5" rx="1" fill="currentColor" fill-opacity="0.45"/>
  <text x="12" y="13.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.2" font-weight="900" letter-spacing="0.3" fill="currentColor" text-anchor="middle">STAERKE</text>
  <!-- Corn emblem -->
  <ellipse cx="12" cy="17.5" rx="2" ry="1.2" fill="currentColor"/>
</svg>
