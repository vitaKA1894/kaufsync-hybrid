<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-dessert" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#EC4899" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Parfait dessert glass with layered cream and cherry on top -->
  <path d="M7 3h10l-2 11a3 3 0 0 1-3 2.5 3 3 0 0 1-3-2.5L7 3z" fill="#EC4899" fill-opacity="0.14"/>
  <path d="M7 3h10l-2 11a3 3 0 0 1-3 2.5 3 3 0 0 1-3-2.5L7 3z" fill="none" stroke="#EC4899" filter="url(#glow-dessert)" stroke-width="2"/>
  <!-- Stem & base -->
  <line x1="12" y1="16.5" x2="12" y2="21" stroke="#EC4899" stroke-width="2"/>
  <line x1="8.5" y1="21" x2="15.5" y2="21" stroke="#EC4899" stroke-width="2" stroke-linecap="round"/>
  <!-- Layers inside -->
  <line x1="8" y1="7" x2="16" y2="7" stroke="#EC4899" stroke-width="1.5"/>
  <line x1="8.5" y1="11" x2="15.5" y2="11" stroke="#EC4899" stroke-width="1.5"/>
  <!-- Cherry on top -->
  <circle cx="12" cy="2" r="1.5" fill="#EC4899" fill-opacity="0.35"/>
</svg>