<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Salami stick with a cut slice showing peppercorns -->
  <rect x="4" y="6" width="13" height="6.5" rx="2" fill="currentColor" fill-opacity="0.22" transform="rotate(-20 10 9)"/>
  <rect x="4" y="6" width="13" height="6.5" rx="2" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-20 10 9)"/>
  <!-- Cut slice lying next to it -->
  <circle cx="16" cy="16" r="4.5" fill="currentColor" fill-opacity="0.35"/>
  <circle cx="16" cy="16" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Peppercorns / fat flecks in slice -->
  <circle cx="14.5" cy="15" r="0.8" fill="currentColor"/>
  <circle cx="17" cy="14.5" r="0.7" fill="currentColor"/>
  <circle cx="16" cy="17.5" r="0.8" fill="currentColor"/>
  <circle cx="18" cy="17" r="0.6" fill="currentColor"/>
</svg>
