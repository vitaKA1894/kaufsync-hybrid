<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Mosquito bug spray aerosol can with crossed out bug -->
  <rect x="7" y="7" width="10" height="14" rx="2" fill="currentColor" fill-opacity="0.22"/>
  <rect x="7" y="7" width="10" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="9.5" y="4" width="5" height="3" rx="0.5" stroke="currentColor" stroke-width="1.8"/>
  <!-- Mosquito bug -->
  <circle cx="12" cy="14" r="2.2" fill="currentColor"/>
  <line x1="8" y1="10" x2="16" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
