<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-insektenschutzmittel" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#EF4444" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Mosquito bug spray aerosol can with crossed out bug -->
  <rect x="7" y="7" width="10" height="14" rx="2" fill="#EF4444" fill-opacity="0.14"/>
  <rect x="7" y="7" width="10" height="14" rx="2" fill="none" stroke="#EF4444" filter="url(#glow-insektenschutzmittel)" stroke-width="2"/>
  <rect x="9.5" y="4" width="5" height="3" rx="0.5" stroke="#EF4444" stroke-width="1.8"/>
  <!-- Mosquito bug -->
  <circle cx="12" cy="14" r="2.2" fill="#EF4444" fill-opacity="0.35"/>
  <line x1="8" y1="10" x2="16" y2="18" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
</svg>