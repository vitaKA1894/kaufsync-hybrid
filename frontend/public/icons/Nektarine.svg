<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-nektarine" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#F97316" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Smooth shiny nectarine with glossy highlight reflection curve and leaf -->
  <circle cx="12" cy="13.5" r="7.5" fill="#F97316" fill-opacity="0.14"/>
  <circle cx="12" cy="13.5" r="7.5" fill="none" stroke="#F97316" filter="url(#glow-nektarine)" stroke-width="2"/>
  <!-- Glossy smooth skin reflection arcs -->
  <path d="M7.5 10c0-2.2 1.8-4 4-4.5" stroke="#F97316" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Small stem and leaf -->
  <path d="M12 6V3.5 M12 4.5c1.5-1.5 3.5-1 4 0s-1.5 1.5-4 0z" fill="#F97316" fill-opacity="0.35" stroke="#F97316" stroke-width="1.2" stroke-linecap="round"/>
</svg>