<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Pack body -->
  <rect x="7" y="9" width="10" height="12" rx="1.5" fill="currentColor" fill-opacity="0.22"/>
  <rect x="7" y="9" width="10" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Open flip top -->
  <path d="M7 9l2-4.5h7l1.5 4.5" fill="currentColor" fill-opacity="0.3" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Cigarette popping out -->
