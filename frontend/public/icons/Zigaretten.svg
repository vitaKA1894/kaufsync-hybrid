  <rect x="10" y="3" width="2.2" height="2.2" fill="currentColor" fill-opacity="0.5"/>
  <!-- Smoke -->
  <path d="M11 1.8c-.4-.8.4-1.2 0-1.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
