<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-lamm" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#EF4444" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Rack of lamb chop (Lammkotelett) with exposed rib bone -->
  <path d="M4 15c0-3.5 3-6.5 8-6.5 3.5 0 6 1.5 6 4.5 0 3.5-2.5 6-7 6-4 0-7-1.5-7-4z" fill="#EF4444" fill-opacity="0.14"/>
  <path d="M4 15c0-3.5 3-6.5 8-6.5 3.5 0 6 1.5 6 4.5 0 3.5-2.5 6-7 6-4 0-7-1.5-7-4z" fill="none" stroke="#EF4444" filter="url(#glow-lamm)" stroke-width="2"/>
  <!-- Long slender rib bone -->
  <path d="M12 9L18 3" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Meat marbling -->
  <circle cx="8.5" cy="14.5" r="1.5" fill="#EF4444" fill-opacity="0.14"/>
