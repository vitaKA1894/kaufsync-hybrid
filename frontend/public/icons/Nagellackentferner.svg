  <circle cx="12" cy="3.5" r="2" fill="currentColor" fill-opacity="0.5"/>
  <rect x="7.2" y="11.5" width="9.6" height="5" rx="1" fill="currentColor" fill-opacity="0.45"/>
  <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="1.8" font-weight="900" letter-spacing="0.2" fill="currentColor" text-anchor="middle">REMOVER</text>
