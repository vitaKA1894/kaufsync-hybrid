<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-nagellackentferner" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#F43F5E" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Nail polish remover pump dispenser -->
  <rect x="7" y="8" width="10" height="13" rx="2" fill="#F43F5E" fill-opacity="0.14"/>
  <rect x="7" y="8" width="10" height="13" rx="2" fill="none" stroke="#F43F5E" filter="url(#glow-nagellackentferner)" stroke-width="2"/>
  <!-- Press pump top with cotton pad -->
  <rect x="9" y="4" width="6" height="4" rx="1" stroke="#F43F5E" stroke-width="1.8"/>
  <circle cx="12" cy="3.5" r="2" fill="#F43F5E" fill-opacity="0.14"/>
  <rect x="7.2" y="11.5" width="9.6" height="5" rx="1" fill="#F43F5E" fill-opacity="0.14"/>
  <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="1.8" font-weight="900" letter-spacing="0.2" fill="#F43F5E" fill-opacity="0.35" text-anchor="middle">REMOVER</text>
</svg>