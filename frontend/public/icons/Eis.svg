<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Ice cream waffle cone with two scoops -->
  <polygon points="7,11 17,11 12,22" fill="currentColor" fill-opacity="0.3"/>
  <polygon points="7,11 17,11 12,22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <!-- Waffle grid lines on cone -->
  <line x1="9.5" y1="11" x2="13.5" y2="18" stroke="currentColor" stroke-width="1.3"/>
  <line x1="14.5" y1="11" x2="10.5" y2="18" stroke="currentColor" stroke-width="1.3"/>
  <!-- Ice cream scoops -->
  <circle cx="12" cy="9.5" r="4.5" fill="currentColor" fill-opacity="0.5"/>
  <circle cx="12" cy="9.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="12" cy="4.5" r="3.2" fill="currentColor" fill-opacity="0.7"/>
</svg>
