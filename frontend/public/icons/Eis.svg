<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-eis" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Ice cream waffle cone with two scoops -->
  <polygon points="7,11 17,11 12,22" fill="#38BDF8" fill-opacity="0.14"/>
  <polygon points="7,11 17,11 12,22" fill="none" stroke="#38BDF8" filter="url(#glow-eis)" stroke-width="2" stroke-linejoin="round"/>
  <!-- Waffle grid lines on cone -->
  <line x1="9.5" y1="11" x2="13.5" y2="18" stroke="#38BDF8" stroke-width="1.3"/>
  <line x1="14.5" y1="11" x2="10.5" y2="18" stroke="#38BDF8" stroke-width="1.3"/>
  <!-- Ice cream scoops -->
  <circle cx="12" cy="9.5" r="4.5" fill="#38BDF8" fill-opacity="0.14"/>
  <circle cx="12" cy="9.5" r="4.5" fill="none" stroke="#38BDF8" stroke-width="1.8"/>
  <circle cx="12" cy="4.5" r="3.2" fill="#38BDF8" fill-opacity="0.14"/>
</svg>