<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Sliced kiwi showing radiant star pattern & black seed ring around pale core -->
  <circle cx="12" cy="12" r="8" fill="currentColor" fill-opacity="0.25"/>
  <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Pale core -->
  <ellipse cx="12" cy="12" rx="2.5" ry="3.5" fill="currentColor" fill-opacity="0.5"/>
  <!-- Black seeds ring -->
  <circle cx="7.5" cy="12" r="0.6" fill="currentColor"/>
  <circle cx="16.5" cy="12" r="0.6" fill="currentColor"/>
  <circle cx="9" cy="8.5" r="0.6" fill="currentColor"/>
  <circle cx="15" cy="8.5" r="0.6" fill="currentColor"/>
  <circle cx="9" cy="15.5" r="0.6" fill="currentColor"/>
  <circle cx="15" cy="15.5" r="0.6" fill="currentColor"/>
</svg>
