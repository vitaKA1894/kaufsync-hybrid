<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-kiwi" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#84CC16" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Sliced kiwi showing radiant star pattern & black seed ring around pale core -->
  <circle cx="12" cy="12" r="8" fill="#84CC16" fill-opacity="0.14"/>
  <circle cx="12" cy="12" r="8" fill="none" stroke="#84CC16" filter="url(#glow-kiwi)" stroke-width="2"/>
  <!-- Pale core -->
  <ellipse cx="12" cy="12" rx="2.5" ry="3.5" fill="#84CC16" fill-opacity="0.14"/>
  <!-- Black seeds ring -->
  <circle cx="7.5" cy="12" r="0.6" fill="#84CC16" fill-opacity="0.35"/>
  <circle cx="16.5" cy="12" r="0.6" fill="#84CC16" fill-opacity="0.35"/>
  <circle cx="9" cy="8.5" r="0.6" fill="#84CC16" fill-opacity="0.35"/>
  <circle cx="15" cy="8.5" r="0.6" fill="#84CC16" fill-opacity="0.35"/>
  <circle cx="9" cy="15.5" r="0.6" fill="#84CC16" fill-opacity="0.35"/>
  <circle cx="15" cy="15.5" r="0.6" fill="#84CC16" fill-opacity="0.35"/>
</svg>