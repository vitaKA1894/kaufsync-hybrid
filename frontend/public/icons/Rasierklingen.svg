<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-rasierklingen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Classic double-edge razor blade with central cutout slot -->
  <rect x="4" y="6" width="16" height="12" rx="1" fill="#94A3B8" fill-opacity="0.14"/>
  <rect x="4" y="6" width="16" height="12" rx="1" fill="none" stroke="#94A3B8" filter="url(#glow-rasierklingen)" stroke-width="2"/>
  <!-- Cutout blade slot pattern -->
  <line x1="7" y1="12" x2="17" y2="12" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="12" r="2.2" fill="#0b0f19" stroke="#94A3B8" stroke-width="1.8"/>
  <circle cx="8" cy="12" r="1" fill="#0b0f19"/>
  <circle cx="16" cy="12" r="1" fill="#0b0f19"/>
</svg>