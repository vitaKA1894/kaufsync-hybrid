<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-corn-flakes" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#FACC15" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Cereal box with cereal bowl & FLAKES label -->
  <rect x="5" y="4" width="14" height="16" rx="2" fill="#FACC15" fill-opacity="0.14"/>
  <rect x="5" y="4" width="14" height="16" rx="2" fill="none" stroke="#FACC15" filter="url(#glow-corn-flakes)" stroke-width="2"/>
  <rect x="6" y="8" width="12" height="5" fill="#FACC15" fill-opacity="0.14"/>
  <text x="12" y="11.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.4" font-weight="900" letter-spacing="0.4" fill="#FACC15" fill-opacity="0.35" text-anchor="middle">FLAKES</text>
  <!-- Cereal bowl at bottom of box -->
  <path d="M8 15c0 2 1.8 3 4 3s4-1 4-3H8z" fill="#FACC15" fill-opacity="0.35"/>
