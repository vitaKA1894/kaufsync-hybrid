<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-schmerzmittel" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#EF4444" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Blister pack of medicine pills with medical cross -->
  <rect x="5" y="4" width="14" height="16" rx="2" fill="#EF4444" fill-opacity="0.2"/>
  <rect x="5" y="4" width="14" height="16" rx="2" fill="none" stroke="#EF4444" filter="url(#glow-schmerzmittel)" stroke-width="2"/>
  <!-- Pills in blister -->
  <circle cx="8.5" cy="8" r="1.8" fill="#EF4444" fill-opacity="0.35"/>
  <circle cx="15.5" cy="8" r="1.8" fill="#EF4444" fill-opacity="0.35"/>
  <!-- Medical cross in center -->
  <path d="M12 12v4m-2-2h4" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="8.5" cy="16.5" r="1.8" fill="#EF4444" fill-opacity="0.35"/>
  <circle cx="15.5" cy="16.5" r="1.8" fill="#EF4444" fill-opacity="0.35"/>
</svg>