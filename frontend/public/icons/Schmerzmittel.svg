<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Blister pack of medicine pills with medical cross -->
  <rect x="5" y="4" width="14" height="16" rx="2" fill="currentColor" fill-opacity="0.2"/>
  <rect x="5" y="4" width="14" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Pills in blister -->
  <circle cx="8.5" cy="8" r="1.8" fill="currentColor"/>
  <circle cx="15.5" cy="8" r="1.8" fill="currentColor"/>
  <!-- Medical cross in center -->
  <path d="M12 12v4m-2-2h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="8.5" cy="16.5" r="1.8" fill="currentColor"/>
  <circle cx="15.5" cy="16.5" r="1.8" fill="currentColor"/>
</svg>
