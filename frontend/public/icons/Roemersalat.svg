  <!-- Diagonal leaf rib veins -->
  <path d="M12 17 C9.5 15.5 8 14 7 13.5 M12 17 C14.5 15.5 16 14 17 13.5" fill="none" stroke="#86EFAC" stroke-width="1.5" stroke-linecap="round"/>
