  <!-- Wavy leaf apex frills -->
  <path d="M6.5 7 C8 8.5 10 6.5 12 7 C14 6.5 16 8.5 17.5 7" fill="none" stroke="#4ADE80" stroke-width="1.6" stroke-linecap="round"/>
