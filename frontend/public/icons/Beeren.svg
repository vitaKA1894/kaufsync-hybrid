<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-beeren" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#EC4899" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Cluster of fresh berries: Strawberry, Blueberries, Blackberry -->
  <!-- Strawberry -->
  <path d="M12 9c-3 0-5 3-4 7s4 5 4 5 3-1 4-5-1-7-4-7z" fill="#EC4899" fill-opacity="0.14"/>
  <path d="M12 9c-3 0-5 3-4 7s4 5 4 5 3-1 4-5-1-7-4-7z" fill="none" stroke="#EC4899" filter="url(#glow-beeren)" stroke-width="2"/>
  <circle cx="10" cy="14" r="0.6" fill="#EC4899" fill-opacity="0.35"/>
  <circle cx="13" cy="13" r="0.6" fill="#EC4899" fill-opacity="0.35"/>
  <circle cx="12" cy="17" r="0.6" fill="#EC4899" fill-opacity="0.35"/>
  <!-- Blueberry on left -->
  <circle cx="6.5" cy="15" r="3.2" fill="#EC4899" fill-opacity="0.14"/>
  <circle cx="6.5" cy="15" r="3.2" fill="none" stroke="#EC4899" stroke-width="1.8"/>
  <!-- Leaves at top -->
  <path d="M10 8c1-2 2-2 2-2s1 0 2 2" stroke="#EC4899" stroke-width="1.8" stroke-linecap="round"/>
