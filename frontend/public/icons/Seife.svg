  <!-- Rising soap bubbles -->
  <circle cx="8" cy="5" r="1.5" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="14" cy="4" r="2" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="1.2"/>
  <circle cx="18" cy="6" r="1" fill="currentColor"/>
