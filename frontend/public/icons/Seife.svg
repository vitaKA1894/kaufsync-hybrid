<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-seife" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#14B8A6" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Bar of soap with lather suds & bubbles -->
  <rect x="4" y="9" width="16" height="11" rx="4" fill="#14B8A6" fill-opacity="0.14"/>
  <rect x="4" y="9" width="16" height="11" rx="4" fill="none" stroke="#14B8A6" filter="url(#glow-seife)" stroke-width="2"/>
  <ellipse cx="12" cy="14.5" rx="5" ry="2.5" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- Rising soap bubbles -->
  <circle cx="8" cy="5" r="1.5" fill="#14B8A6" fill-opacity="0.14" stroke="#14B8A6" stroke-width="1.2"/>
  <circle cx="14" cy="4" r="2" fill="#14B8A6" fill-opacity="0.14" stroke="#14B8A6" stroke-width="1.2"/>
  <circle cx="18" cy="6" r="1" fill="#14B8A6" fill-opacity="0.35"/>
</svg>