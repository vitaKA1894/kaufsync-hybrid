<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-batterien" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#FACC15" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- AA battery with (+) and (-) terminals and charge indicator -->
  <rect x="7" y="6" width="10" height="15" rx="2" fill="#FACC15" fill-opacity="0.14"/>
  <rect x="7" y="6" width="10" height="15" rx="2" fill="none" stroke="#FACC15" filter="url(#glow-batterien)" stroke-width="2"/>
  <!-- Positive (+) terminal stud -->
  <rect x="10" y="3" width="4" height="3" rx="0.5" fill="#FACC15" fill-opacity="0.35" stroke="#FACC15" stroke-width="1.2"/>
  <!-- Positive (+) symbol -->
  <path d="M12 9v4m-2-2h4" stroke="#FACC15" stroke-width="2" stroke-linecap="round"/>
  <!-- Negative (-) symbol -->
  <line x1="10" y1="18" x2="14" y2="18" stroke="#FACC15" stroke-width="2" stroke-linecap="round"/>
</svg>