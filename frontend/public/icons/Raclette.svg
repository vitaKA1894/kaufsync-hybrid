<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-raclette" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#FBBF24" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Square raclette pan with melted cheese & scraper -->
  <rect x="4" y="6" width="12" height="12" rx="2" fill="#FBBF24" fill-opacity="0.14"/>
  <rect x="4" y="6" width="12" height="12" rx="2" fill="none" stroke="#FBBF24" filter="url(#glow-raclette)" stroke-width="2"/>
  <!-- Long handle -->
  <line x1="16" y1="12" x2="22" y2="12" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Melted cheese waves -->
  <path d="M6 10c2 1.5 4 1.5 6 0m-6 4c2 1.5 4 1.5 6 0" stroke="#FBBF24" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="10" cy="8.5" r="0.8" fill="#FBBF24" fill-opacity="0.35"/>
</svg>