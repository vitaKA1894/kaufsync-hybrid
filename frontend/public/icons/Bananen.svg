<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Unmistakable bunch of 2 curved bananas with stem crown and dark tips -->
  <!-- Banana 2 (behind) -->
  <path d="M15 5c-3 5-7 10-10 13 2 1.5 5 1.5 8-.5 3-2 5-6 6.5-10.5" fill="currentColor" fill-opacity="0.2"/>
  <path d="M15 5c-3 5-7 10-10 13 2 1.5 5 1.5 8-.5 3-2 5-6 6.5-10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Banana 1 (front) -->
  <path d="M17 5.5C14 11 9 16 3.5 15.5c-.8-.2-1.2-.8-.7-1.5 1.2-1.8 5-6.5 10.5-8.5" fill="currentColor" fill-opacity="0.32"/>
  <path d="M17 5.5C14 11 9 16 3.5 15.5c-.8-.2-1.2-.8-.7-1.5 1.2-1.8 5-6.5 10.5-8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ridge facet line along front banana -->
  <path d="M17 5.5C13 10.5 8 14.5 3 14.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Crown stalk connecting at top -->
  <path d="M15 2.5h3.5l-.5 3h-3z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Dark flower tips at bottom -->
  <circle cx="3.2" cy="15.2" r="0.9" fill="currentColor"/>
  <circle cx="5" cy="18" r="0.8" fill="currentColor"/>
</svg>
