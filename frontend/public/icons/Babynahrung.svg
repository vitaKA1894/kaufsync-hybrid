<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-babynahrung" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#F59E0B" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Baby milk feeding bottle with scale markings and nipple -->
  <rect x="8" y="9" width="8" height="12" rx="2" fill="#F59E0B" fill-opacity="0.14"/>
  <rect x="8" y="9" width="8" height="12" rx="2" fill="none" stroke="#F59E0B" filter="url(#glow-babynahrung)" stroke-width="2"/>
  <rect x="7" y="6" width="10" height="3" rx="1" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Rubber nipple -->
  <path d="M10 6c0-2 1-3 2-3s2 1 2 3" fill="#F59E0B" fill-opacity="0.35" stroke="#F59E0B" stroke-width="1.5"/>
  <!-- Measurement tick marks -->
  <line x1="10" y1="12" x2="12" y2="12" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="10" y1="15" x2="13" y2="15" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="10" y1="18" x2="12" y2="18" stroke="#F59E0B" stroke-width="1.5"/>
</svg>