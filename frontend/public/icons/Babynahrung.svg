<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Baby milk feeding bottle with scale markings and nipple -->
  <rect x="8" y="9" width="8" height="12" rx="2" fill="currentColor" fill-opacity="0.25"/>
  <rect x="8" y="9" width="8" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <rect x="7" y="6" width="10" height="3" rx="1" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="1.5"/>
  <!-- Rubber nipple -->
  <path d="M10 6c0-2 1-3 2-3s2 1 2 3" fill="currentColor" stroke="currentColor" stroke-width="1.5"/>
  <!-- Measurement tick marks -->
  <line x1="10" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
  <line x1="10" y1="15" x2="13" y2="15" stroke="currentColor" stroke-width="1.5"/>
  <line x1="10" y1="18" x2="12" y2="18" stroke="currentColor" stroke-width="1.5"/>
</svg>
