<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Block of Greek feta in brine with olive on top -->
  <rect x="5" y="8" width="14" height="11" rx="1.5" fill="currentColor" fill-opacity="0.25"/>
  <rect x="5" y="8" width="14" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Black Kalamata olive on top -->
  <circle cx="12" cy="5" r="2" fill="currentColor"/>
  <!-- Crumbled herb flecks -->
  <circle cx="8" cy="12" r="0.8" fill="currentColor"/>
  <circle cx="15" cy="12" r="0.8" fill="currentColor"/>
  <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.6" font-weight="900" letter-spacing="0.4" fill="currentColor" text-anchor="middle">FETA</text>
</svg>
