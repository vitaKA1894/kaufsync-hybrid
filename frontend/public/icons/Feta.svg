<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-feta" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#22C55E" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Block of Greek feta in brine with olive on top -->
  <rect x="5" y="8" width="14" height="11" rx="1.5" fill="#F8FAFC" fill-opacity="0.14"/>
  <rect x="5" y="8" width="14" height="11" rx="1.5" fill="none" stroke="#F8FAFC" filter="url(#glow-feta)" stroke-width="2"/>
  <!-- Black Kalamata olive on top -->
  <circle cx="12" cy="5" r="2" fill="#F8FAFC" fill-opacity="0.35"/>
  <!-- Crumbled herb flecks -->
  <circle cx="8" cy="12" r="0.8" fill="#F8FAFC" fill-opacity="0.35"/>
  <circle cx="15" cy="12" r="0.8" fill="#F8FAFC" fill-opacity="0.35"/>
  <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.6" font-weight="900" letter-spacing="0.4" fill="#F8FAFC" fill-opacity="0.35" text-anchor="middle">FETA</text>
</svg>