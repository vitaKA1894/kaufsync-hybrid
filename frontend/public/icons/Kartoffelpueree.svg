<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-kartoffelpueree" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#FDE047" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Bowl of fluffy mashed potatoes (Kartoffelstock) with melting butter pat & steam -->
  <path d="M4 13c0 4.5 3.5 7.5 8 7.5s8-3 8-7.5H4z" fill="#FDE047" fill-opacity="0.14"/>
  <path d="M4 13c0 4.5 3.5 7.5 8 7.5s8-3 8-7.5H4z" fill="none" stroke="#FDE047" filter="url(#glow-kartoffelpueree)" stroke-width="2"/>
  <!-- Fluffy potato swirl mound -->
  <path d="M5 13c1-3 3.5-5 7-5s6 2 7 5" fill="#FDE047" fill-opacity="0.14" stroke="#FDE047" stroke-width="1.8"/>
  <!-- Melting butter cube on top -->
  <rect x="10" y="8" width="4" height="3" rx="0.5" fill="#FDE047" fill-opacity="0.35" stroke="#FDE047" stroke-width="1.2"/>
  <!-- Steam -->
  <path d="M12 5V2m-3 3L8 3m7 2l1-2" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round"/>
</svg>