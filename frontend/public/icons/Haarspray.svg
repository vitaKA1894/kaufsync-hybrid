<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-haarspray" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#8B5CF6" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Tall hairspray aerosol can with spray nozzle mist -->
  <rect x="8" y="7" width="8" height="14" rx="2" fill="#8B5CF6" fill-opacity="0.14"/>
  <rect x="8" y="7" width="8" height="14" rx="2" fill="none" stroke="#8B5CF6" filter="url(#glow-haarspray)" stroke-width="2"/>
  <rect x="10" y="4" width="4" height="3" rx="0.5" stroke="#8B5CF6" stroke-width="1.5"/>
  <!-- Spray mist lines -->
  <path d="M6 3c-1.5 0-3 1-3 2.5m1 2l-2 1" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
  <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2" font-weight="900" fill="#8B5CF6" fill-opacity="0.35" text-anchor="middle">SPRAY</text>
</svg>