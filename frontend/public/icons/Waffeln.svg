  <rect x="13.5" y="7" width="3.5" height="3.5" rx="0.5" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="7" y="13.5" width="3.5" height="3.5" rx="0.5" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="1.2"/>
  <rect x="13.5" y="13.5" width="3.5" height="3.5" rx="0.5" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-width="1.2"/>
</svg>