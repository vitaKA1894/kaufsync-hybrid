<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Icing sugar metal shaker with fine perforated top -->
  <rect x="7" y="7" width="10" height="14" rx="2" fill="currentColor" fill-opacity="0.25"/>
  <rect x="7" y="7" width="10" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Perforated shaker cap -->
  <rect x="6" y="4" width="12" height="3" rx="1" fill="currentColor" fill-opacity="0.5" stroke="currentColor" stroke-width="1.8"/>
  <circle cx="8.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="10.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="12" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="13.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="15.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <text x="12" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.3" font-weight="900" letter-spacing="0.3" fill="currentColor" text-anchor="middle">PUDER</text>
  <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2" font-weight="800" fill="currentColor" text-anchor="middle">ZUCKER</text>
</svg>
