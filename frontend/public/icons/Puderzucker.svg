<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-puderzucker" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Icing sugar metal shaker with fine perforated top -->
  <rect x="7" y="7" width="10" height="14" rx="2" fill="#F8FAFC" fill-opacity="0.14"/>
  <rect x="7" y="7" width="10" height="14" rx="2" fill="none" stroke="#F8FAFC" filter="url(#glow-puderzucker)" stroke-width="2"/>
  <!-- Perforated shaker cap -->
  <rect x="6" y="4" width="12" height="3" rx="1" fill="#F8FAFC" fill-opacity="0.14" stroke="#F8FAFC" stroke-width="1.8"/>
  <circle cx="8.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="10.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="12" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="13.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <circle cx="15.5" cy="5.5" r="0.5" fill="#0b0f19"/>
  <text x="12" y="13.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.3" font-weight="900" letter-spacing="0.3" fill="#F8FAFC" fill-opacity="0.35" text-anchor="middle">PUDER</text>
  <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2" font-weight="800" fill="#F8FAFC" fill-opacity="0.35" text-anchor="middle">ZUCKER</text>
</svg>