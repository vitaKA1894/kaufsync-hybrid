  <polygon points="10,19 19,8 21,19" fill="#FACC15" fill-opacity="0.14" stroke="#FACC15" stroke-width="2" stroke-linejoin="round"/>
  <!-- Seasoning specks -->
  <circle cx="10" cy="12" r="0.7" fill="#FACC15" fill-opacity="0.35"/>
  <circle cx="13" cy="10" r="0.7" fill="#FACC15" fill-opacity="0.35"/>
