<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-limette" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#84CC16" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Round lime wedge slice with visible spoke segments -->
  <circle cx="12" cy="12" r="8" fill="#84CC16" fill-opacity="0.14"/>
  <circle cx="12" cy="12" r="8" fill="none" stroke="#84CC16" filter="url(#glow-limette)" stroke-width="2"/>
  <circle cx="12" cy="12" r="6" fill="none" stroke="#84CC16" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <!-- Radiating segments -->
  <line x1="12" y1="6" x2="12" y2="18" stroke="#84CC16" stroke-width="1.5"/>
  <line x1="6" y1="12" x2="18" y2="12" stroke="#84CC16" stroke-width="1.5"/>
  <line x1="7.8" y1="7.8" x2="16.2" y2="16.2" stroke="#84CC16" stroke-width="1.5"/>
  <line x1="7.8" y1="16.2" x2="16.2" y2="7.8" stroke="#84CC16" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="1.5" fill="#84CC16" fill-opacity="0.35"/>
</svg>