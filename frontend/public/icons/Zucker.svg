<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-zucker" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Sugar dispenser / pack with sugar cubes and ZUCKER label -->
  <rect x="6" y="8" width="12" height="13" rx="2" fill="#F8FAFC" fill-opacity="0.14"/>
  <rect x="6" y="8" width="12" height="13" rx="2" fill="none" stroke="#F8FAFC" filter="url(#glow-zucker)" stroke-width="2"/>
  <!-- Pourer cap -->
  <path d="M10 8V4h4v4" stroke="#F8FAFC" stroke-width="1.8"/>
  <line x1="12" y1="4" x2="12" y2="1.5" stroke="#F8FAFC" stroke-width="2" stroke-linecap="round"/>
  <rect x="6.5" y="11.5" width="11" height="5.5" rx="1" fill="#F8FAFC" fill-opacity="0.14"/>
  <text x="12" y="15.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.1" font-weight="900" letter-spacing="0.2" fill="#F8FAFC" fill-opacity="0.35" text-anchor="middle">ZUCKER</text>
</svg>