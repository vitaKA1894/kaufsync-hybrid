<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-gin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Classic British gin bottle with label -->
  <rect x="6.5" y="7" width="11" height="14" rx="2" fill="#38BDF8" fill-opacity="0.14"/>
  <rect x="6.5" y="7" width="11" height="14" rx="2" fill="none" stroke="#38BDF8" filter="url(#glow-gin)" stroke-width="2"/>
  <path d="M10 7V3h4v4" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-width="1.8"/>
  <!-- Label with GIN and juniper berries -->
  <rect x="7.5" y="11" width="9" height="6" rx="1" fill="#38BDF8" fill-opacity="0.14"/>
  <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="2.6" font-weight="900" letter-spacing="0.4" fill="#38BDF8" fill-opacity="0.35" text-anchor="middle">GIN</text>
</svg>