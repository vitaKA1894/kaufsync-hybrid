<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-feuchttuecher" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Wet wipes pack with pop-up lid and wipe pulling out -->
  <rect x="4" y="9" width="16" height="11" rx="3" fill="#38BDF8" fill-opacity="0.14"/>
  <rect x="4" y="9" width="16" height="11" rx="3" fill="none" stroke="#38BDF8" filter="url(#glow-feuchttuecher)" stroke-width="2"/>
  <!-- Plastic snap lid -->
  <ellipse cx="12" cy="14" rx="4.5" ry="2.5" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-width="1.8"/>
  <!-- Wipe pulling out of top -->
  <path d="M10 13c1-4 3-4 4-7-2 1-4 3-4 7z" fill="#38BDF8" fill-opacity="0.35"/>
</svg>