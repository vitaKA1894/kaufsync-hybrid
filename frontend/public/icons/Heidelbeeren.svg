<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-heidelbeeren" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#6366F1" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Two plump blueberries with star calyx crown on top -->
  <circle cx="9" cy="15" r="5.5" fill="#6366F1" fill-opacity="0.14"/>
  <circle cx="9" cy="15" r="5.5" fill="none" stroke="#6366F1" filter="url(#glow-heidelbeeren)" stroke-width="2"/>
  <!-- Star crown on blueberry 1 -->
  <circle cx="9" cy="12.5" r="1.8" fill="none" stroke="#6366F1" stroke-width="1.3"/>
  <polygon points="9,11.5 9.5,12.5 10.5,12.5 9.8,13 10,14 9,13.3 8,14 8.2,13 7.5,12.5 8.5,12.5" fill="#6366F1" fill-opacity="0.35"/>
  <!-- Blueberry 2 -->
  <circle cx="16" cy="11" r="4.5" fill="#6366F1" fill-opacity="0.14"/>
  <circle cx="16" cy="11" r="4.5" fill="none" stroke="#6366F1" stroke-width="2"/>
  <circle cx="16" cy="8.5" r="1.3" stroke="#6366F1" stroke-width="1.2"/>
</svg>