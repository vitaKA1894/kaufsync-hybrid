  <rect x="13.5" y="11" width="1.5" height="1.5" fill="currentColor"/>
  <rect x="11" y="14.5" width="1.5" height="1.5" fill="currentColor"/>
  <circle cx="10" cy="14" r="0.6" fill="currentColor"/>
  <circle cx="14" cy="15" r="0.6" fill="currentColor"/>
</svg>
