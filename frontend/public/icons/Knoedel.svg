<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-knoedel" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#FBBF24" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Round German dumplings (Semmelknödel) with bread & parsley bits -->
  <circle cx="12" cy="13" r="7.5" fill="#FBBF24" fill-opacity="0.14"/>
  <circle cx="12" cy="13" r="7.5" fill="none" stroke="#FBBF24" filter="url(#glow-knoedel)" stroke-width="2"/>
  <!-- Breadcrumbs & herb specks inside dumpling -->
  <rect x="9" y="10" width="1.5" height="1.5" fill="#FBBF24" fill-opacity="0.35"/>
  <rect x="13.5" y="11" width="1.5" height="1.5" fill="#FBBF24" fill-opacity="0.35"/>
  <rect x="11" y="14.5" width="1.5" height="1.5" fill="#FBBF24" fill-opacity="0.35"/>
  <circle cx="10" cy="14" r="0.6" fill="#FBBF24" fill-opacity="0.35"/>
  <circle cx="14" cy="15" r="0.6" fill="#FBBF24" fill-opacity="0.35"/>
</svg>