  <!-- Wavy ruffled outer leaf edges -->
  <path d="M5 11c1.5-1.5 3-1 4.5.5s3.5 1.5 5 0 3-2 4.5-.5" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M5.5 15c2-1 4-.5 5.5 1s3.5 1 5.5 0 2-2 3.5-1" fill="none" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
