<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-salat" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#22C55E" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Fresh round head of butterhead/curly lettuce with ruffled leafy layers -->
  <circle cx="12" cy="13" r="8" fill="#22C55E" fill-opacity="0.14"/>
