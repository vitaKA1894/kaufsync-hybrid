<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="glow-spargel" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.75" flood-color="#86EFAC" flood-opacity="0.75"/>
    </filter>
  </defs>
<!-- Bundle of 3 fresh asparagus spears with triangular scale tips and ribbon band -->
  <line x1="7.5" y1="21" x2="7.5" y2="6.5" stroke="#86EFAC" filter="url(#glow-spargel)" stroke-width="2" stroke-linecap="round"/>
  <line x1="16.5" y1="21" x2="16.5" y2="6.5" stroke="#86EFAC" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="21" x2="12" y2="4" stroke="#86EFAC" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Asparagus spear cone heads with scale tips -->
  <path d="M12 2l-2 3.5h4L12 2z" fill="#86EFAC" fill-opacity="0.35" stroke="#86EFAC" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M7.5 4.5l-1.8 3h3.6L7.5 4.5z" fill="#86EFAC" fill-opacity="0.35" stroke="#86EFAC" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M16.5 4.5l-1.8 3h3.6L16.5 4.5z" fill="#86EFAC" fill-opacity="0.35" stroke="#86EFAC" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Scale bracts on stalks -->
  <path d="M6.5 10l2-1.5 M15.5 10l2-1.5 M11 8l2-1.5" stroke="#86EFAC" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tying ribbon -->
  <rect x="5.5" y="13.5" width="13" height="3" rx="1" fill="#86EFAC" fill-opacity="0.14" stroke="#86EFAC" stroke-width="1.5"/>
</svg>