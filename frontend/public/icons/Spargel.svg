<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Bundle of 3 fresh asparagus spears with triangular scale tips and ribbon band -->
  <line x1="7.5" y1="21" x2="7.5" y2="6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="16.5" y1="21" x2="16.5" y2="6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="21" x2="12" y2="4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Asparagus spear cone heads with scale tips -->
  <path d="M12 2l-2 3.5h4L12 2z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M7.5 4.5l-1.8 3h3.6L7.5 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M16.5 4.5l-1.8 3h3.6L16.5 4.5z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Scale bracts on stalks -->
  <path d="M6.5 10l2-1.5 M15.5 10l2-1.5 M11 8l2-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Tying ribbon -->
  <rect x="5.5" y="13.5" width="13" height="3" rx="1" fill="currentColor" fill-opacity="0.45" stroke="currentColor" stroke-width="1.5"/>
</svg>
