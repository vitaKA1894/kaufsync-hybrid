  <path d="M3 10c0 6 4.5 11 9 11s9-5 9-11H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Rind white inner line -->
  <path d="M5 11.5c.5 4 3.5 7.5 7 7.5s6.5-3.5 7-7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2"/>
  <!-- Black watermelon seeds -->
  <circle cx="8" cy="13" r="1" fill="currentColor"/>
  <circle cx="12" cy="15.5" r="1" fill="currentColor"/>
  <circle cx="16" cy="13" r="1" fill="currentColor"/>
</svg>
