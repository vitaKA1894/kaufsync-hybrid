<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Two cotton buds / Q-tips crossed with fluffy tips -->
  <line x1="4" y1="20" x2="20" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="4.5" cy="19.5" rx="2.5" ry="1.5" fill="currentColor" stroke="currentColor" stroke-width="1.2" transform="rotate(-45 4.5 19.5)"/>
  <ellipse cx="19.5" cy="4.5" rx="2.5" ry="1.5" fill="currentColor" stroke="currentColor" stroke-width="1.2" transform="rotate(-45 19.5 4.5)"/>
  <!-- Second Q-tip -->
  <line x1="6" y1="4" x2="18" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="6" cy="4" rx="2.2" ry="1.3" fill="currentColor" transform="rotate(45 6 4)"/>
  <ellipse cx="18" cy="20" rx="2.2" ry="1.3" fill="currentColor" transform="rotate(45 18 20)"/>
</svg>
