<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Toothpick container with pointed wooden toothpicks sticking out -->
  <rect x="7" y="10" width="10" height="11" rx="2" fill="currentColor" fill-opacity="0.22"/>
  <rect x="7" y="10" width="10" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Transparent top lid -->
  <rect x="8" y="7" width="8" height="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Pointed toothpicks -->
  <line x1="9" y1="10" x2="9" y2="3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="12" y1="10" x2="12" y2="2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="15" y1="10" x2="15" y2="3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
