services:
  kaufsync:
    build:
      context: .
      dockerfile: Dockerfile
    image: kaufsync:latest
    container_name: kaufsync
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - JWT_SECRET_KEY=change_this_to_a_secure_random_string_in_production
      - CORS_ORIGINS=http://localhost,https://localhost,capacitor://localhost
      # - VAPID_PUBLIC_KEY=
      # - VAPID_PRIVATE_KEY=
